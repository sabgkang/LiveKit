<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>本機語音助理</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/livekit-client.js"></script>
  <script defer src="/audio.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <main>
    <p class="eyebrow">LIVEKIT · LOCAL</p>
    <h1>本機語音助理</h1>
    <p>使用 Jabra 麥克風與喇叭，透過雲端 AI 進行中英文對話。</p>
    <div class="devices">
      <label>麥克風<select id="microphone"><option value="">系統預設</option></select></label>
      <label>喇叭<select id="speaker"><option value="">系統預設</option></select></label>
    </div>
    <div class="actions">
      <button id="devices">授權並更新裝置</button>
      <button id="test-speaker">測試喇叭</button>
      <button id="connect" class="primary">開始對話</button>
      <button id="disconnect" disabled>結束對話</button>
      <button id="play" disabled>啟用／重試聲音播放</button>
    </div>
    <p id="status" role="status" aria-live="polite">尚未連線</p>
    <p id="error" role="alert"></p>
    <p id="audio-status" role="status" aria-live="polite">尚未收到助理音訊。可先測試喇叭。</p>
    <audio id="speaker-test" controls hidden aria-label="喇叭測試音"></audio>
    <section aria-labelledby="transcript-title">
      <h2 id="transcript-title">對話逐字稿</h2>
      <p class="hint">逐字稿只顯示於此頁，重新整理即清除。雲端推論會接收對話內容。</p>
      <div id="transcript" aria-live="polite"></div>
    </section>
    <div id="audio"></div>
  </main>
</body>
</html>
